# 默认训练配置
model:
  type: pointnet2   # kpconv | pointnet2
  num_classes: 9
  k: 16
  in_channels: 4    # rgb(3) + intensity(1)

train:
  batch_size: 2
  epochs: 100
  lr: 0.01
  optimizer: sgd           # sgd | adamw
  weight_decay: 1.0e-4
  momentum: 0.9
  scheduler: cosine        # cosine | step
  num_workers: 0
  log_every_n_steps: 20
  val_every_n_epochs: 1

data:
  dataset: toronto3d
  dataset_root: ./Toronto_3D_npz
  num_points: 4096
  split: train             # train | val | test
  augment: true

paths:
  log_dir: ./runs
  ckpt_dir: ./checkpoints

device: cuda
seed: 42
